<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor IA — entrar</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><meta name="theme-color" content="#0f1115">
<style>
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#e8eaf0;font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;box-sizing:border-box}
 form{background:#181b22;border:1px solid #2a2f3a;border-radius:14px;padding:28px;width:100%;max-width:360px}
 h1{margin:0 0 18px;font-size:22px} input,button{width:100%;box-sizing:border-box;font:inherit;padding:13px;border-radius:9px}
 input{background:#0f1115;color:#e8eaf0;border:1px solid #2a2f3a;margin-bottom:12px} button{background:#7c5cff;color:#fff;border:0;font-weight:600}
 .err{color:#ff5c7a;font-size:14px;margin:0 0 10px}
</style></head><body>
<form method="post" action="/login">
 <h1>🎬 Editor IA</h1>
 <p class="err" id="err" hidden>Senha incorreta.</p>
 <input type="password" name="password" placeholder="Senha" autofocus required autocomplete="current-password">
 <button>Entrar</button>
</form>
<script>if(location.search.includes("erro"))document.getElementById("err").hidden=false</script>
</body></html>
